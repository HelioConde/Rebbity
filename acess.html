<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebbity</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/jquery-3.6.0.min.js"></script>
    <script src="./js/mobile.js"></script>
</head>

<body>
    <nav>
        <a href="./index.html">
            <div> <img src="img/logo.png" alt=""></div>
        </a>
        <a href="./form-restaurant.html">
            <div>Cadastrar Restaurante</div>
        </a>
        <a href="./form-market.html">
            <div>Cadastrar Mercado</div>
        </a>
        <a href="./acess.html">
            <div class="partner">Já sou parceiro</div>
        </a>
    </nav>

    <main>
        <div id="alert">
            <div class="alertBox">
                <div class="alertText">
                    O E-mail já está em uso!
                </div>
                <div>
                    <button id="confirmBox">Confirma</button>
                </div>
            </div>
        </div>
        <div id="acess">
            <div id="formAcessImg">

            </div>
            <div id="formAcess">
                <form action="./authentication.php" method="post">
                    <div class="formLogo">
                        <img src="./img/logo.png" alt="">
                    </div>
                    <div class="formTitle">
                        Portal do Parceiro
                    </div>
                    <div>
                        Gerencie sua loja de forma fácil e rápida
                    </div>
                    <div class="flexForm">
                        <div class="flexDIV3">
                            <label for="email">
                                E-mail
                            </label>
                            <div class="flexForm2">
                                <input type="email" name="email" id="email" placeholder="Digite o seu E-mail" required>
                            </div>
                        </div>
                    </div>
                    <div class="flexForm">
                        <div class="flexDIV3">
                            <label for="password">
                                Senha
                            </label>
                            <div class="flexForm2">
                                <input type="password" name="password" id="password" placeholder="Digite a sua senha"
                                    required>
                            </div>
                        </div>
                    </div>
                    <div class="flexForm">
                        <div class="flexDIV auto">
                            <input type="submit" class="acessSubmit" value="Enviar">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script>
        var query = location.search.slice(1);
        var partes = query.split('&');
        var data = {};
        partes.forEach(function (parte) {
            var chaveValor = parte.split('=');
            var chave = chaveValor[0];
            var valor = chaveValor[1];
            data[chave] = valor;
        });

        if (data.erro == 'password') {
            $("#alert").css("display", "flex");
            $(".alertText").html('Senha incorreta!');
        }
        if (data.erro == 'email') {
            $("#alert").css("display", "flex");
            $(".alertText").html('E-mail incorreto!');
        }

        $("#confirmBox").on('mouseup', function () {
            $("#alert").css("display", "none");
        })
    </script>
</body>

</html>
