<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>cardápio</title>
</head>
<body id="body"class="classnameflex">
    <div>
    <h1>Cardápio</h1>
    <p  class="subtitulo">Seu cardápio é a vitrine aonde os clientes vão ver os seus produtos</p>
   
    
    <div class="listaopcoes"></div>
    <!--cardápio separado em categorias e pratos-->
    <div class="botao">
    <div class="button" id="abriropcoes"><a>Adicionar categoria</a></div>
    
    
    </div>
    <div class="botao">
    <div class="button" id="abriritens"><a>Adicionar item</a></div>
    </div>
    </div>
    <div>
    <div id="menuitens" class="menu" style="display: none;">
        <form action="">
        <div class="fechar">
            <h2>Adicionar itens</h2>
            <label for="nomeprato"><p>Qual o nome do prato?</p></label>
            <input type="text"  id="nomeprato"placeholder="Digite o nome do seu prato">
            <label for="descricaoprato"><p>Qual a descrição do prato?</p></label>
            <textarea type="text" id="descricaoprato"placeholder="Digite a descrição do prato"></textarea><br />
            <input type="submit" value="Inserir prato no cardápio">
        </div>
    </form>
    </div>
    
    <div id="menuopcoes" class="menu" style="display: none;">
        <form action="">
        <div class="fechar">
            <h2>Adicionar opções</h2>
            <label for="nomecategoria">Qual o nome da categoria?</label><br/>
            <input type="text" id="nomecategoria"placeholder="Digite o nome da sua categoria">
            <label for="descricaocategoria"><p>Qual a descrição da categoria?</p></label>
            <textarea id="descricaocategoria" placeholder="Digite a descrição da categoria"></textarea><br/>
            <input type="submit" value="Criar categoria">
        </div>
        </form>
    </div>
    </div>

    <script src="./js/cardapio.js"></script>
</body>
</html>
