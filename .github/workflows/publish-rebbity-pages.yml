name: Rebbity Pages — publicar demonstracao validada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rebbity-public-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar snapshot publico validado sem mesclar backend
        uses: actions/checkout@v4
        with:
          ref: d53e4d36690a1c13a44ede1f223731f525854d28
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de teste
        run: npm install --no-audit --no-fund
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Preparar somente arquivos estaticos permitidos
        run: npm run build:pages
      - name: Conferir isolamento do artefato GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-pages/index.html
          test -s dist-pages/demo.html
          test -s dist-pages/sobre.html
          forbidden="$(find dist-pages -type f \\( -iname '*.php' -o -iname '*.sql' -o -iname '*.sqlite*' -o -iname '*.db' -o -iname '.env*' -o -iname '*.pem' -o -iname '*.key' -o -iname '*config.php*' \\) -print)"
          if [ -n "$forbidden" ]; then
            echo "::error::O artefato contém arquivos de backend/dados privados e não será publicado."
            exit 1
          fi
          if find dist-pages -type l | grep -q .; then
            echo "::error::Links simbólicos não são permitidos no artefato publicado."
            exit 1
          fi
          echo "Artefato isolado: $(find dist-pages -type f | wc -l) arquivos estáticos permitidos."
      - name: Verificar paginas e operacoes locais em cinco resolucoes
        run: npm run test:pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar site publico
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Guardar capturas automaticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebbity-public-main-screenshots
          path: artifacts/pages-screenshots/
          if-no-files-found: ignore
